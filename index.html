<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Aira ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #d8e7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #333;
        }

        .heart {
            position: fixed;
            bottom: -40px;
            font-size: 22px;
            animation: floatUp 8s linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            width: 90%;
            max-width: 620px;
            background: rgba(255, 255, 255, 0.92);
            padding: 42px 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 17px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            border: none;
            padding: 18px;
            border-radius: 18px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        button:active {
            transform: scale(0.98);
        }

        .joke-btn {
            background: #ffe27a;
            color: #333;
        }

        .compliment-btn {
            background: #ff9fc5;
            color: white;
        }

        .result {
            margin-top: 30px;
            min-height: 110px;
            padding: 25px;
            border-radius: 20px;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            line-height: 1.6;
            animation: fadeIn 0.4s ease;
        }

        .signature {
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .subtitle {
                font-size: 15px;
            }

            button {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- Floating hearts -->
    <div class="heart" style="left: 8%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 23%; animation-delay: 2s;">💗</div>
    <div class="heart" style="left: 43%; animation-delay: 4s;">💕</div>
    <div class="heart" style="left: 63%; animation-delay: 1s;">💖</div>
    <div class="heart" style="left: 83%; animation-delay: 3s;">❤️</div>

    <div class="container">

        <h1>Hey Aira ❤️</h1>

        <p class="subtitle">
            I made you a tiny corner of the internet.
            <br>
            Because apparently just texting you wasn't enough. 😂
        </p>

        <div class="buttons">

            <button class="joke-btn" onclick="tellJoke()">
                😂 Aira, Tell Me a Joke
            </button>

            <button class="compliment-btn" onclick="complimentMe()">
                💕 Aira, Compliment Me
            </button>

        </div>

        <div class="result" id="result">
            Pick one, Aira 👀
        </div>

        <div class="signature">
            Made with questionable amounts of coding and affection ❤️
        </div>

    </div>

    <script>

        const jokes = [

            "Aira, I was going to make a joke about Austin... but it's already hotter than my laptop trying to run this website. 😂",

            "Aira, why don't programmers like nature? Because it has way too many bugs. 🐛",

            "Aira, I tried to make this website perfect... then I remembered I'm the one coding it. 😭",

            "Aira, my computer asked me if I wanted to save my work. I said yes. It asked if I wanted to save my dignity too. I closed the laptop. 😂",

            "Aira, Austin has two seasons: hot and slightly less hot. 🌵😂",

            "Aira, I have 47 tabs open in my brain right now and somehow you're responsible for at least 12 of them. 😭",

            "Aira, I tried being normal today. It was incredibly boring, so I came back to bothering you instead. 😂",

            "Aira, if overthinking were an Olympic sport, we'd both have gold medals by now.",

            "Aira, I wanted to tell you a really good joke... but then I realized you already clicked this button, so clearly you have excellent taste. 😌",

            "Aira, what do you call a computer that sings? A-Dell. ...I'll show myself out. 🚪😂",

            "Aira, I asked my laptop for relationship advice. It said, 'Have you tried turning it off and on again?' 😭",

            "Aira, this website has two buttons because I couldn't decide whether to make you laugh or remind you how gorgeous you are."
        ];


        const compliments = [

            "Aira, you're genuinely gorgeous. Like, unnecessarily gorgeous. There was really no need to go that hard. ❤️",

            "Aira, you're beautiful, but honestly, your kindness is what makes you stand out even more. ❤️",

            "Aira, you have that rare combination of being ridiculously pretty and having a genuinely good heart.",

            "Aira, your smile could probably make a bad day reconsider its entire existence. 😂❤️",

            "Aira, you're the kind of person who makes people feel comfortable just by being around them.",

            "Aira, you're beautiful in a way that's honestly a little unfair to everyone else. 😭",

            "Aira, if being gorgeous and kind were illegal, you'd definitely be in trouble. 🚔❤️",

            "Aira, there's something about your personality that makes you very easy to admire.",

            "Aira, you're one of those people who somehow becomes more attractive the more someone gets to know you.",

            "Aira, your looks might be what someone notices first, but your heart is what they'd remember.",

            "Aira, you deserve to be reminded that you're amazing sometimes. So consider this your reminder. 💕",

            "Aira, I could probably write a hundred compliments and still not explain properly what makes you so special.",

            "Aira, you're gorgeous on the outside, but your personality is honestly what makes you unforgettable.",

            "Aira, I don't know how you manage to be this pretty and this sweet at the same time. It feels slightly unfair. 😂❤️",

            "Aira, you're the type of person someone could meet once and still remember for a very long time.",

            "Aira, there's a really beautiful energy about you. It's not just your looks.",

            "Aira, you're pretty enough to get someone's attention, but you're kind enough to make them want to stay.",

            "Aira... if you ever forget how amazing you are, just come back to this button. I'll remind you. ❤️"
        ];


        function showMessage(message) {

            const result = document.getElementById("result");

            result.style.animation = "none";

            void result.offsetWidth;

            result.style.animation = "fadeIn 0.4s ease";

            result.innerHTML = message;
        }


        function tellJoke() {

            const randomIndex =
                Math.floor(Math.random() * jokes.length);

            showMessage(jokes[randomIndex]);

        }


        function complimentMe() {

            const randomIndex =
                Math.floor(Math.random() * compliments.length);

            showMessage(compliments[randomIndex]);

        }

    </script>

</body>
</html>
